# Real, already-verified facts transcribed from
# ../../configs/avionics-base-network-configs.md -- the actual captured
# `show` command output from the original Packet Tracer project. This is
# the historical baseline `avionics-net verify` compares the generator's
# output against; it is never regenerated, only read.
#
# router-id note: only the 7 devices whose router-id is DIRECTLY
# observable in a captured `show ip ospf neighbor` table are listed here.
# APF-DistSwitch/ARF-DistSwitch/MRF-DistSwitch's router-ids were never
# captured in the original documentation (only HQ's and AMF's neighbor
# tables were included as examples) -- the generator predicts them
# consistently with the same "highest interface IP" policy confirmed by
# these 7, but that prediction is not itself a verified historical fact,
# so it is deliberately left out of this file. See PROJECT_NOTES.md.

