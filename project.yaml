name: Avionics Base Network Simulation
slug: avionics-base-network

category: experiments
subcategory: "Computer Networks coursework (CS260L)"

status: completed

visibility: public

description:
  short: "A Cisco Packet Tracer aviation-network simulation (OSPF, ~20 VLANs), plus avionics-configgen: a declarative Python/Jinja2 IOS config generator that reproduces all 77 of its real captured addressing facts exactly."
  long: |
    A Cisco Packet Tracer simulation of a fictional aviation-base network:
    a headquarters site (firewall, router, distribution switch, DNS/FTP/
    Web/Mail servers) connected to four factory sites via routed
    point-to-point links, using OSPF area 0 for dynamic routing and around
    20 department VLANs on separate /24 subnets. Built for a Computer
    Networks lab (Air University, Semester 3, Fall 2024).
    Added avionics-configgen: a declarative Cisco IOS configuration
    generator (YAML topology -> VLSM IP planner -> device-independent
    resolved model -> Jinja templates -> IOS config), modeled on the same
    pattern used by Ansible resource modules and Cisco NSO. Verified by
    regenerating this exact network's real, previously-captured
    addressing facts -- all 77 match exactly, including an OSPF
    router-id policy corrected to Cisco's real default behavior after
    cross-referencing the original captured neighbor-table evidence.

