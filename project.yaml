description:
  short: "A Cisco Packet Tracer simulation of a multi-site aviation network with OSPF routing, ~20 VLANs, and verified service reachability."
  long: |
    A Cisco Packet Tracer simulation of a fictional aviation-base network:
    a headquarters site (firewall, router, distribution switch, DNS/FTP/
    Web/Mail servers) connected to four factory sites via routed
    point-to-point links, using OSPF area 0 for dynamic routing and around
    20 department VLANs on separate /24 subnets. Built for a Computer
    Networks lab (Air University, Semester 3, Fall 2024).

technologies: ["Cisco Packet Tracer", "OSPF", "VLANs", "Cisco IOS"]
